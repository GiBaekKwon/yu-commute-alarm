<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계산 테스트 — 영남대 통학 기상 알리미</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { --bg:#f6f7fb; --card:#fff; --text:#1d2333; --muted:#5f6880; --border:#e2e5ee; --pass:#1a7f45; --fail:#c62828; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12141b; --card:#1c1f29; --text:#eceef4; --muted:#a3aabd; --border:#2c3040; --pass:#5fd08f; --fail:#ff7b7b; }
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:16px; background:var(--bg); color:var(--text);
           font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height:1.5; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    #summary { font-weight: 700; font-size: 18px; margin: 12px 0; }
    #summary.pass { color: var(--pass); } #summary.fail { color: var(--fail); }
    ol { list-style: none; padding: 0; margin: 0; }
    li { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; overflow-wrap:anywhere; }
    .tag { display:inline-block; min-width:44px; font-weight:700; }
    .pass .tag { color: var(--pass); } .fail .tag { color: var(--fail); }
    .detail { color: var(--muted); font-size: 13px; white-space: pre-wrap; margin-top: 4px; }
    .muted { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>계산 테스트</h1>
  <p class="muted">time.js · calc.js(기상 계산, plan.md 3장) · classes.js(다음 수업 · 10분 전 알림, plan.md A-3) 규칙 검사. 규칙을 바꾸면 이 케이스도 함께 고친다.</p>
  <div id="summary">실행 중…</div>
  <ol id="results"></ol>
</main>

<script src="js/time.js?v=20261122a"></script>
<script src="js/calc.js?v=20261122a"></script>
<script src="js/classes.js?v=20261122a"></script>
<script src="js/commute.js?v=20261122a"></script>
<script>
(function () {
  'use strict';
  var T = window.WakeTime, C = window.WakeCalc, W = window.WakeClasses, M = window.WakeCommute;

  /* ---- 테스트용 데이터 (예시 노선, 실제 시간표 아님) ---- */
  var ROUTE_A = { rideMin: 40, times: {   // data/bus/route-a.json 과 같은 값
    weekday:  ['06:40','07:25','08:05','08:45','09:30','10:30','12:00','13:30','15:00','17:00','19:00','21:00'],
    saturday: ['07:30','08:30','10:00','12:00','15:00','18:00'],
    sunday:   ['08:00','11:00','14:00','17:00'] } };
  var ROUTE_C = { rideMin: 55, times: {   // data/bus/route-c.json 과 같은 값
    weekday:  ['07:10','08:20','10:00','13:00','16:00','18:30'],
    saturday: ['08:00','12:00','17:00'],
    sunday:   ['09:00','15:00'] } };
  var BASE = { prepMin: 40, walkToStopMin: 5, walkToRoomMin: 8, bufferMin: 0 };

  function commute(over) {
    var c = {}, k;
    for (k in BASE) c[k] = BASE[k];
    for (k in over || {}) c[k] = over[k];
    return c;
  }
  function cls(day, start, end, name) {
    return { id: name || (day + start), name: name || '수업', day: day, start: start, end: end, room: '' };
  }
  var L = T.label;

  /* ---- 케이스: [이름, 실행 함수 → 실제값, 기대값] ---- */
  var cases = [];
  function t(name, fn, expected) { cases.push({ name: name, fn: fn, expected: expected }); }

  // time.js
  t('time: "08:05" → 485분', function () { return T.toMin('08:05'); }, 485);
  t('time: "24:00" 은 거부(NaN)', function () { return isNaN(T.toMin('24:00')); }, true);
  t('time: "8:05" 처럼 두 자리 아니면 거부', function () { return isNaN(T.toMin('8:05')); }, true);
  // 11/21 버그: 10시 7분이 밤 10시(22:07)로 저장됨 → 24시간제 글자 칸 + parseClock
  [['10:07', '10:07'], ['1007', '10:07'], ['10시 7분', '10:07'], ['10시7분', '10:07'], ['10시반', '10:30'], ['10시', '10:00'],
   ['9:05', '09:05'], ['930', '09:30'], ['9', '09:00'], ['22:07', '22:07'], ['12:00', '12:00'], ['00:10', '00:10'],
   ['오전 10:07', '10:07'], ['오후 10:07', '22:07'], ['오후 3시', '15:00'], ['오전 12시', '00:00'], ['오후 12시 30분', '12:30'], ['3:00 PM', '15:00'],
   [' 10 : 07 ', '10:07'], ['', '']].forEach(function (c) {
    t('parseClock: ' + JSON.stringify(c[0]) + ' → ' + JSON.stringify(c[1]), function () { return T.parseClock(c[0]); }, c[1]);
  });
  ['24:00', '10:60', '10:7', '오후 15시', '오후 0시', 'abc', '12345', '10시 70분'].forEach(function (bad) {
    t('parseClock: ' + JSON.stringify(bad) + ' → 거부(null)', function () { return T.parseClock(bad); }, null);
  });
  t('time: -20분 → 전날 23:40', function () { return L(-20); }, '전날 23:40');
  t('time: 1450분 → 다음날 00:10', function () { return L(1450); }, '다음날 00:10');
  t('time: 카운트다운 755초 → 00:12:35', function () { return T.countdown(755); }, '00:12:35');

  // 1. 기획서 예시
  t('1. 기획서 예시: 09:00 수업 → 08:05 버스 → 07:20 기상', function () {
    var r = C.calcDay([cls(1, '09:00', '10:15')], BASE, ROUTE_A, 1);
    return [r.status, L(r.bus), L(r.departure), L(r.wake)];
  }, ['ok', '08:05', '08:00', '07:20']);

  t('2. 여유 10분 → 한 대 앞(07:25) 버스, 06:40 기상', function () {
    var r = C.calcDay([cls(1, '09:00', '10:15')], commute({ bufferMin: 10 }), ROUTE_A, 1);
    return [L(r.bus), L(r.wake)];
  }, ['07:25', '06:40']);

  t('3. 탑승 한계와 버스 시각이 같으면 그 버스를 탐 (한계 08:05)', function () {
    var r = C.calcDay([cls(1, '09:00', '10:15')], commute({ walkToRoomMin: 15 }), ROUTE_A, 1);
    return [L(r.boardLimit), L(r.bus)];
  }, ['08:05', '08:05']);

  t('4. 수업 없는 날 → no-class, 기상 시각 없음', function () {
    var r = C.calcDay([cls(1, '09:00', '10:15')], BASE, ROUTE_A, 2);
    return [r.status, r.wake === undefined];
  }, ['no-class', true]);

  t('5. 공강 있어도 첫 수업 기준 (입력 순서 13:00, 09:00)', function () {
    var r = C.calcDay([cls(1, '13:00', '14:15', '운영체제'), cls(1, '09:00', '10:15', '자료구조')], BASE, ROUTE_A, 1);
    return [r.firstClass.name, L(r.wake)];
  }, ['자료구조', '07:20']);

  t('6. 토요일은 saturday 시각 사용 (10:00 수업 → 08:30 버스)', function () {
    var r = C.calcDay([cls(6, '10:00', '11:00')], BASE, ROUTE_A, 6);
    return [r.dayType, L(r.bus), L(r.wake)];
  }, ['saturday', '08:30', '07:45']);

  t('7. 일요일(0)은 sunday 시각 사용 (12:00 수업 → 11:00 버스)', function () {
    var r = C.calcDay([cls(0, '12:00', '13:00')], BASE, ROUTE_A, 0);
    return [r.dayType, L(r.bus), L(r.wake)];
  }, ['sunday', '11:00', '10:15']);

  t('8. 첫차 지각: 노선 C 08:00 수업 → 첫차 07:10, 13분 지각', function () {
    var r = C.calcDay([cls(1, '08:00', '09:15')], BASE, ROUTE_C, 1);
    return [r.status, L(r.bus), r.lateMin, L(r.wake)];
  }, ['late', '07:10', 13, '06:25']);

  t('9. 자정 넘김: 00:20 버스, 준비 30분 → 전날 23:40 기상', function () {
    var route = { rideMin: 30, times: { weekday: ['00:20', '05:00'], saturday: [], sunday: [] } };
    var r = C.calcDay([cls(1, '01:00', '02:00')], commute({ prepMin: 30, walkToStopMin: 10, walkToRoomMin: 5 }), route, 1);
    return [L(r.bus), L(r.wake), r.wake < 0];
  }, ['00:20', '전날 23:40', true]);

  t('10. 그 요일 유형에 버스가 아예 없음 → no-bus', function () {
    var route = { rideMin: 30, times: { weekday: ['08:00'], saturday: [], sunday: [] } };
    return C.calcDay([cls(0, '10:00', '11:00')], BASE, route, 0).status;
  }, 'no-bus');

  // 오늘 화면: 버스 놓침
  var MON = C.calcDay([cls(1, '09:00', '10:15')], BASE, ROUTE_A, 1);   // 08:05 버스, 08:00 출발
  t('11. 출발 시각(08:00) 정각이면 아직 on-time', function () {
    return C.checkNow(MON, BASE, ROUTE_A, T.toMin('08:00')).status;
  }, 'on-time');

  t('12. 버스 놓침: 08:01 → 다음 08:45 버스, 33분 지각', function () {
    var r = C.checkNow(MON, BASE, ROUTE_A, T.toMin('08:01'));
    return [r.status, L(r.nextBus), r.lateMin];
  }, ['missed', '08:45', 33]);

  t('13. 막차 놓침: 20:58 + 도보 5분 > 막차 21:00 → no-more-bus', function () {
    return C.checkNow(MON, BASE, ROUTE_A, T.toMin('20:58')).status;
  }, 'no-more-bus');

  t('14. 수업 없는 날은 checkNow 가 none', function () {
    var r = C.calcDay([], BASE, ROUTE_A, 3);
    return C.checkNow(r, BASE, ROUTE_A, 600).status;
  }, 'none');

  // 입력 검증
  t('15. 검증: 시작 ≥ 종료 거부', function () {
    return C.validateClasses([cls(1, '10:00', '10:00')]).length > 0;
  }, true);

  t('16. 검증: 같은 요일 겹침 거부, 다른 요일은 통과', function () {
    var same = C.validateClasses([cls(1, '09:00', '10:15', 'a'), cls(1, '10:00', '11:00', 'b')]).length > 0;
    var diff = C.validateClasses([cls(1, '09:00', '10:15', 'a'), cls(2, '10:00', '11:00', 'b')]).length === 0;
    return [same, diff];
  }, [true, true]);

  t('17. 검증: 통학 값 음수 · 빈칸 · 소수 거부, 여유 시간만 비워도 됨', function () {
    return [
      C.validateCommute(commute({ prepMin: -1 })).length > 0,
      C.validateCommute(commute({ walkToStopMin: '' })).length > 0,
      C.validateCommute(commute({ walkToRoomMin: 2.5 })).length > 0,
      C.validateCommute(commute({ bufferMin: '' })).length === 0
    ];
  }, [true, true, true, true]);

  t('18. 검증: 버스 시각 24:10 · 역순 거부, 예시 노선 A 는 통과', function () {
    var bad1 = { rideMin: 40, times: { weekday: ['23:50', '24:10'], saturday: [], sunday: [] } };
    var bad2 = { rideMin: 40, times: { weekday: ['08:00', '07:00'], saturday: [], sunday: [] } };
    return [C.validateRoute(bad1).length > 0, C.validateRoute(bad2).length > 0, C.validateRoute(ROUTE_A).length === 0];
  }, [true, true, true]);

  /* ---- classes.js: 다음 수업 · 10분 전 알림 (plan.md A-3) ---- */
  function at(hms, ymd) { return new Date((ymd || '2026-11-23') + 'T' + hms); }   // 2026-11-23 = 월요일
  var ONE = [cls(1, '09:00', '10:15', 'a')];
  function A(hms, shown) { var r = W.alertTarget(ONE, at(hms), shown); return r ? r.secondsLeft : null; }

  t('알림 19. 시작 10분 0초 전 → 알림 (600초)', function () { return A('08:50:00'); }, 600);
  t('알림 20. 시작 10분 1초 전 → 아직 아님', function () { return A('08:49:59'); }, null);
  t('알림 21. 7분 전에 페이지를 열어도 실제 남은 시간(420초)', function () { return A('08:53:00'); }, 420);
  t('알림 22. 시작 1초 전 → 알림', function () { return A('08:59:59'); }, 1);
  t('알림 23. 시작 정각 → 이미 시작해 건너뜀', function () { return A('09:00:00'); }, null);
  t('알림 24. 수업 중 → 건너뜀', function () { return A('09:30:00'); }, null);
  t('알림 25. 오늘 이미 보여 준 수업 → 다시 안 뜸', function () { return A('08:55:00', [W.alertKey(ONE[0])]); }, null);
  t('알림 26. 다른 요일 수업은 대상 아님 (화요일 08:55)', function () { return W.alertTarget(ONE, at('08:55:00', '2026-11-24'), []); }, null);
  t('알림 27. 10분 안에 두 수업이면 먼저 시작하는 것', function () {
    var two = [cls(1, '09:05', '10:00', 'b'), cls(1, '09:00', '09:05', 'a')];
    var r = W.alertTarget(two, at('08:58:00'), []);
    return [r.cls.id, r.secondsLeft];
  }, ['a', 120]);
  t('알림 28. 먼저 것을 보여 줬으면 다음 것', function () {
    var two = [cls(1, '09:05', '10:00', 'b'), cls(1, '09:00', '09:05', 'a')];
    return W.alertTarget(two, at('08:58:00'), [W.alertKey(two[1])]).cls.id;
  }, 'b');
  t('알림 29. 체험 키는 접두어로 구분', function () { return W.alertKey(ONE[0], 'demo:'); }, 'demo:a|09:00');
  t('알림 30. 날짜가 바뀌면 기록 초기화 · 같은 날이면 유지', function () {
    var rec = { date: '2026-11-23', keys: ['a|09:00'] };
    return [W.alertedForToday(rec, at('08:00:00', '2026-11-24')).keys, W.alertedForToday(rec, at('08:00:00')).keys];
  }, [[], ['a|09:00']]);

  var WEEK = [cls(1, '09:00', '10:15', 'm1'), cls(1, '13:00', '14:15', 'm2'), cls(2, '10:30', '11:45', 't1')];
  t('다음 31. 월 08:00 → 오늘 09:00 (3600초)', function () { var n = W.nextClass(WEEK, at('08:00:00')); return [n.cls.id, n.offset, n.secondsLeft]; }, ['m1', 0, 3600]);
  t('다음 32. 시작 정각이면 그 다음 수업', function () { return W.nextClass(WEEK, at('09:00:00')).cls.id; }, 'm2');
  t('다음 33. 오늘 끝 → 내일 첫 수업 (offset 1)', function () { var n = W.nextClass(WEEK, at('15:00:00')); return [n.cls.id, n.offset, n.secondsLeft]; }, ['t1', 1, 70200]);
  t('다음 34. 금요일 밤 → 다음 주 월요일 (offset 3)', function () { var n = W.nextClass(WEEK, at('20:00:00', '2026-11-27')); return [n.cls.id, n.offset]; }, ['m1', 3]);
  t('다음 35. 수업이 하나도 없으면 null', function () { return W.nextClass([], at('08:00:00')); }, null);
  t('다음 36. 오늘 남은 수업 · 수업 중 판단 (09:30)', function () {
    return [W.remainingToday(WEEK, at('09:30:00')).map(function (c) { return c.id; }), W.currentClass(WEEK, at('09:30:00')).id, W.currentClass(WEEK, at('11:00:00'))];
  }, [['m1', 'm2'], 'm1', null]);
  t('다음 37. 수업 다 끝나면 오늘 남은 수업 0개', function () { return W.remainingToday(WEEK, at('14:15:00')).length; }, 0);
  t('표시 38. 하루 넘는 카운트다운 · 짧은 남은 시간', function () { return [W.countdownLong(90061), W.countdownLong(755), W.shortLeft(520), W.shortLeft(45)]; }, ['1일 01:01:01', '00:12:35', '8분 40초', '45초']);

  // commute.js — 11/21 통학 시간 계산 (출발지 → 도착지 이동 시간 · 총 소요 · 요일별 기상)
  var SUB = { to: '영남대', stations: [{ name: '반월당', minutes: 26.8 }, { name: '범어', minutes: 21.1 }, { name: '임당', minutes: 1.7 }, { name: '영남대', minutes: 0 }] };
  var TRV = { prepMin: 40, travelMin: 37, bufferMin: 10 };
  var TWEEK = C.calcWeek([cls(1, '09:00', '10:15', 'm1'), cls(2, '10:30', '11:45', 't1')], TRV, null);
  t('통학 39. 지하철: "반월당역" → 영남대 26.8분 → 27분 (올림)', function () { var r = M.subwayMinutes(SUB, '반월당역', '영남대'); return [r.minutes, r.from, r.to]; }, [27, '반월당', '영남대']);
  t('통학 40. 지하철: 도착지 비우면 영남대 · 역끼리(반월당 → 범어 5.7분 → 6분)', function () { return [M.subwayMinutes(SUB, '범어', '').minutes, M.subwayMinutes(SUB, '반월당', '범어').minutes]; }, [22, 6]);
  t('통학 41. 지하철: 노선에 없는 곳 · 같은 역 · 빈칸 → null (직접 입력으로)', function () { return [M.subwayMinutes(SUB, '경산시장', '영남대'), M.subwayMinutes(SUB, '영남대', '영남대역'), M.subwayMinutes(SUB, '', '영남대'), M.subwayMinutes(null, '반월당', '영남대')]; }, [null, null, null, null]);
  t('통학 42. 총 소요 = 준비 + 이동 + 여유 (87분 → "1시간 27분")', function () { var b = M.breakdown(TRV); return [b.prep, b.travel, b.buffer, b.total, M.duration(b.total), M.duration(45), M.duration(120)]; }, [40, 37, 10, 87, '1시간 27분', '45분', '2시간']);
  t('통학 43. 요일별 표: 월 09:00 → 08:13 출발 → 07:33 기상, 화 10:30 → 09:43 → 09:03', function () { return M.planRows(TWEEK).map(function (r) { return r.name + r.first + r.departure + r.wake; }); }, ['월09:0008:1307:33', '화10:3009:4309:03']);
  t('통학 44. 띠: 월 08:00 → 출발 08:13 까지 780초', function () { var s = M.stripState(TWEEK, TRV, null, at('08:00:00')); return [s.kind, s.secondsLeft]; }, ['before', 780]);
  t('통학 45. 띠: 출발 정각(08:13:00)부터 "출발 시각 지남", 08:30 이면 09:07 도착 · 7분 지각', function () {
    var a = M.stripState(TWEEK, TRV, null, at('08:13:00')), b = M.stripState(TWEEK, TRV, null, at('08:30:00'));
    return [a.kind, b.kind, L(b.check.arrival), b.check.lateMin];
  }, ['missed', 'missed', '09:07', 7]);
  t('통학 46. 띠: 첫 수업 시작 후 → 내일(화) 안내, 화요일 수업 후 → 다음 주 월요일(offset 6)', function () {
    var a = M.stripState(TWEEK, TRV, null, at('09:00:00')), b = M.stripState(TWEEK, TRV, null, at('12:00:00', '2026-11-24'));
    return [a.kind, a.offset, T.label(a.day.wake), b.kind, b.offset];
  }, ['next', 1, '09:03', 'next', 6]);
  t('통학 47. 띠: 수업이 하나도 없으면 none', function () { return M.stripState(C.calcWeek([], TRV, null), TRV, null, at('08:00:00')).kind; }, 'none');
  t('통학 48. 단축어용 글: 총 소요 + 요일별 첫 수업 · 출발 · 기상', function () { return M.shortcutText(TWEEK, TRV).split('\n'); },
    ['[통학 알리미] 요일별 기상 시각', '총 소요 1시간 27분 (준비 40분 · 이동 37분 · 여유 10분)', '월 첫 수업 09:00 → 출발 08:13 → 기상 07:33', '화 첫 수업 10:30 → 출발 09:43 → 기상 09:03']);
  t('통학 49. 이동 시간 모드 검사: 이동 0분 · 빈칸 거부, 여유 빈칸은 0', function () {
    return [C.validateCommute({ prepMin: 40, travelMin: 0, bufferMin: 0 }).map(function (e) { return e.field; }), C.validateCommute({ prepMin: 40, travelMin: 37, bufferMin: '' }).length, C.validateCommute({ prepMin: '', travelMin: '', bufferMin: 0 }).length];
  }, [['travelMin'], 0, 2]);
  t('통학 50. 단축어 알람: 수업 있는 요일만 { 요일: 기상 } (월 07:33 · 화 09:03)', function () { return M.shortcutAlarms(TWEEK); },
    { alarms: { 1: '07:33', 2: '09:03' }, moved: [], skipped: [] });
  t('통학 51. 단축어 주소: 아이폰에서 확인한 시험 링크와 같음 (키 순서 무관)', function () { return M.shortcutUrl({ 3: '08:10', 1: '07:20' }); },
    'shortcuts://run-shortcut?name=%ED%86%B5%ED%95%99%EC%95%8C%EB%9E%8C&input=text&text=%7B%221%22%3A%2207%3A20%22%2C%223%22%3A%2208%3A10%22%7D');
  t('통학 52. 단축어 알람: 자정 넘김 — 화 01:00 수업 → 전날 월 23:33, 일 00:30 → 토 23:03', function () {
    var a = M.shortcutAlarms(C.calcWeek([cls(2, '01:00', '02:00', 't')], TRV, null));
    var b = M.shortcutAlarms(C.calcWeek([cls(0, '00:30', '01:00', 's')], TRV, null));
    return [a.alarms, a.moved.length, b.alarms];
  }, [{ 1: '23:33' }, 1, { 6: '23:03' }]);
  t('통학 53. 단축어 알람: 전날로 옮긴 알람이 그 요일 알람과 겹치면 빼고 skipped · 수업 없으면 빈 값', function () {
    var a = M.shortcutAlarms(C.calcWeek([cls(1, '09:00', '10:15', 'm'), cls(2, '01:00', '02:00', 't')], TRV, null));
    return [a.alarms, a.skipped, M.shortcutAlarms(C.calcWeek([], TRV, null)).alarms];
  }, [{ 1: '07:33' }, [{ day: 2, to: 1, time: '23:33' }], {}]);

  /* ---- 실행 · 표시 ---- */
  var list = document.getElementById('results');
  var passed = 0;
  cases.forEach(function (c) {
    var actual, ok, err = null;
    try {
      actual = c.fn();
      ok = JSON.stringify(actual) === JSON.stringify(c.expected);
    } catch (e) {
      ok = false; err = e;
    }
    if (ok) passed++;
    var li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = ok ? 'PASS' : 'FAIL';
    li.appendChild(tag);
    li.appendChild(document.createTextNode(' ' + c.name));
    if (!ok) {
      var d = document.createElement('div');
      d.className = 'detail';
      d.textContent = err ? ('오류: ' + err.message)
        : ('기대: ' + JSON.stringify(c.expected) + '\n실제: ' + JSON.stringify(actual));
      li.appendChild(d);
    }
    list.appendChild(li);
  });

  var sum = document.getElementById('summary');
  sum.textContent = passed + ' / ' + cases.length + ' PASS' + (passed === cases.length ? ' ✅' : ' ❌');
  sum.className = passed === cases.length ? 'pass' : 'fail';
  document.title = (passed === cases.length ? 'PASS ' : 'FAIL ') + passed + '/' + cases.length + ' — 계산 테스트';
})();
</script>
